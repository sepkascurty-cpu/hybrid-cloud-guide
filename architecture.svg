<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ED8B00"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D8102"/>
    </marker>
  </defs>

  <rect width="1280" height="860" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="640" y="36" text-anchor="middle" fill="#232F3E" font-size="26" font-weight="700">Hybrid Cloud — Reference Architecture</text>
  <text x="640" y="60" text-anchor="middle" fill="#555555" font-size="13">On-premises data center connected to AWS via VPN + Direct Connect · two Availability Zones</text>

  <!-- Users -->
  <g>
    <rect x="424" y="66" width="52" height="34" rx="3" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
    <rect x="416" y="100" width="68" height="5" rx="2" fill="#232F3E"/>
    <text x="450" y="124" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="600">Users</text>
    <text x="488" y="82" fill="#232F3E" font-size="13">www.example.com</text>
    <line x1="450" y1="128" x2="450" y2="176" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- On-Premises Data Center -->
  <g>
    <rect x="20" y="330" width="250" height="460" fill="#FAFAFA" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="145" y="356" text-anchor="middle" fill="#555555" font-size="15" font-weight="700">On-Premises Data Center</text>
    <rect x="40" y="380" width="210" height="90" rx="6" fill="#F2F2F2" stroke="#999999" stroke-width="1.5"/>
    <text x="145" y="420" text-anchor="middle" fill="#232F3E" font-size="14" font-weight="700">VMware / Kubernetes</text>
    <text x="145" y="442" text-anchor="middle" fill="#555555" font-size="12">Workloads &amp; VMs</text>
    <rect x="40" y="490" width="210" height="80" rx="6" fill="#E8F0FE" stroke="#2E73B8" stroke-width="1.5"/>
    <text x="145" y="522" text-anchor="middle" fill="#232F3E" font-size="14" font-weight="700">On-Premises Database</text>
    <text x="145" y="544" text-anchor="middle" fill="#555555" font-size="12">Core ledger · ERP</text>
    <rect x="40" y="600" width="210" height="110" rx="6" fill="#FFF3E0" stroke="#ED8B00" stroke-width="1.5"/>
    <text x="145" y="632" text-anchor="middle" fill="#232F3E" font-size="14" font-weight="700">Customer Gateway</text>
    <text x="145" y="652" text-anchor="middle" fill="#555555" font-size="12">Router · BGP ASN 65000</text>
    <text x="145" y="672" text-anchor="middle" fill="#555555" font-size="12">Public IP 203.0.113.10</text>
    <text x="145" y="752" text-anchor="middle" fill="#777777" font-size="12" font-style="italic">All traffic exits via the Customer Gateway</text>
  </g>

  <!-- AWS Cloud -->
  <g>
    <rect x="300" y="150" width="960" height="660" fill="none" stroke="#232F3E" stroke-width="2"/>
    <rect x="312" y="162" width="28" height="28" fill="#232F3E"/>
    <text x="326" y="181" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">aws</text>
    <text x="348" y="183" fill="#232F3E" font-size="16" font-weight="700">AWS Cloud</text>
  </g>

  <!-- Top row: Route 53 / CloudFront / WAF / Shield -->
  <g>
    <g transform="translate(450,208)">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#8C4FFF"/>
      <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">53</text>
    </g>
    <text x="450" y="252" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">Amazon Route 53</text>
    <text x="450" y="268" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">DNS service</text>

    <g transform="translate(610,208)">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#8C4FFF"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="13" ry="5.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <text x="610" y="252" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">Amazon CloudFront</text>
    <text x="610" y="268" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">CDN</text>

    <g transform="translate(770,208)">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#D13239"/>
      <path d="M0,-15 L13,-9 V0 C13,8 7,13 0,16 C-7,13 -13,8 -13,0 V-9 Z" fill="#FFFFFF"/>
    </g>
    <text x="770" y="252" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">AWS WAF</text>
    <text x="770" y="268" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">Web Application Firewall</text>

    <g transform="translate(1060,208)">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#D13239"/>
      <path d="M0,-15 L13,-9 V0 C13,8 7,13 0,16 C-7,13 -13,8 -13,0 V-9 Z" fill="#FFFFFF"/>
      <text x="0" y="6" text-anchor="middle" fill="#D13239" font-size="13" font-weight="700">✓</text>
    </g>
    <text x="1060" y="252" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">AWS Shield</text>
    <text x="1060" y="268" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">DDoS protection</text>

    <!-- top-row arrows -->
    <line x1="478" y1="208" x2="578" y2="208" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="528" y="196" text-anchor="middle" fill="#232F3E" font-size="12">DNS</text>
    <line x1="638" y1="208" x2="738" y2="208" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="688" y="196" text-anchor="middle" fill="#232F3E" font-size="12">filtered</text>
    <line x1="1032" y1="208" x2="800" y2="208" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="916" y="196" text-anchor="middle" fill="#232F3E" font-size="12">DDoS protection</text>
    <!-- CloudFront down to ALB -->
    <polyline points="610,236 610,300 830,300 830,484" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="720" y="290" text-anchor="middle" fill="#232F3E" font-size="12">HTTPS</text>
  </g>

  <!-- Left rail inside AWS cloud: S3 / EFS / ElastiCache -->
  <g>
    <g transform="translate(348,388)">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#3F9C35"/>
      <path d="M-14,-8 L14,-8 L10,12 L-10,12 Z" fill="#FFFFFF"/>
      <ellipse cx="0" cy="-8" rx="14" ry="4" fill="#FFFFFF"/>
    </g>
    <text x="348" y="434" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">Amazon S3</text>
    <text x="348" y="448" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">Static storage</text>

    <g transform="translate(348,478)">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#3F9C35"/>
      <rect x="-14" y="-12" width="10" height="6" rx="2" fill="#FFFFFF"/>
      <rect x="-14" y="-8" width="28" height="20" rx="2" fill="#FFFFFF"/>
    </g>
    <text x="348" y="524" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">Amazon EFS</text>
    <text x="348" y="538" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">Shared storage</text>

    <g transform="translate(348,568)">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#3B48CC"/>
      <ellipse cx="0" cy="-10" rx="13" ry="4.5" fill="#FFFFFF"/>
      <ellipse cx="0" cy="0" rx="13" ry="4.5" fill="#FFFFFF" opacity="0.7"/>
      <ellipse cx="0" cy="10" rx="13" ry="4.5" fill="#FFFFFF" opacity="0.45"/>
    </g>
    <text x="348" y="614" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">ElastiCache</text>
    <text x="348" y="628" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">Caching service</text>
  </g>

  <!-- VPC -->
  <g>
    <rect x="400" y="330" width="850" height="470" fill="none" stroke="#1D8102" stroke-width="2.5"/>
    <text x="414" y="352" fill="#1D8102" font-size="14" font-weight="700">VPC  10.0.0.0/16</text>

    <!-- AZ 1 -->
    <rect x="415" y="365" width="405" height="425" fill="#F7FAFD" stroke="#2E73B8" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="617" y="384" text-anchor="middle" fill="#2E73B8" font-size="14" font-weight="700">Availability Zone 1</text>
    <!-- AZ 2 -->
    <rect x="840" y="365" width="405" height="425" fill="#F7FAFD" stroke="#2E73B8" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1042" y="384" text-anchor="middle" fill="#2E73B8" font-size="14" font-weight="700">Availability Zone 2</text>

    <!-- Subnets AZ-1 -->
    <rect x="425" y="392" width="385" height="70" fill="#E6F2E6"/>
    <text x="437" y="410" fill="#2F6B2F" font-size="13" font-weight="700">Public subnet</text>
    <rect x="425" y="470" width="385" height="78" fill="#E8F0FE"/>
    <text x="437" y="488" fill="#2E4A7A" font-size="13" font-weight="700">Web subnet</text>
    <rect x="425" y="556" width="385" height="78" fill="#FFF1E0"/>
    <text x="437" y="574" fill="#8A5A00" font-size="13" font-weight="700">App subnet</text>
    <rect x="425" y="642" width="385" height="138" fill="#EDEFF5"/>
    <text x="437" y="676" fill="#3B3B6D" font-size="13" font-weight="700">DB subnet</text>
    <!-- Subnets AZ-2 -->
    <rect x="850" y="392" width="385" height="70" fill="#E6F2E6"/>
    <text x="862" y="410" fill="#2F6B2F" font-size="13" font-weight="700">Public subnet</text>
    <rect x="850" y="470" width="385" height="78" fill="#E8F0FE"/>
    <text x="862" y="488" fill="#2E4A7A" font-size="13" font-weight="700">Web subnet</text>
    <rect x="850" y="556" width="385" height="78" fill="#FFF1E0"/>
    <text x="862" y="574" fill="#8A5A00" font-size="13" font-weight="700">App subnet</text>
    <rect x="850" y="642" width="385" height="138" fill="#EDEFF5"/>
    <text x="862" y="676" fill="#3B3B6D" font-size="13" font-weight="700">DB subnet</text>

    <!-- NAT Gateways -->
    <g transform="translate(617,434)">
      <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#8C4FFF"/>
      <path d="M-12,-6 H8 M8,-6 l-5,-4 M8,-6 l-5,4 M12,8 H-8 M-8,8 l5,-4 M-8,8 l5,4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
    <text x="645" y="438" fill="#232F3E" font-size="12">NAT Gateway</text>
    <g transform="translate(1042,434)">
      <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#8C4FFF"/>
      <path d="M-12,-6 H8 M8,-6 l-5,-4 M8,-6 l-5,4 M12,8 H-8 M-8,8 l5,-4 M-8,8 l5,4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
    <text x="1070" y="438" fill="#232F3E" font-size="12">NAT Gateway</text>

    <!-- EC2 web tier -->
    <g>
      <rect x="542" y="490" width="40" height="40" rx="4" fill="#FF9900"/>
      <rect x="531" y="494" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="531" y="503" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="531" y="512" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="652" y="490" width="40" height="40" rx="4" fill="#FF9900"/>
      <rect x="641" y="494" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="641" y="503" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="641" y="512" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <text x="617" y="546" text-anchor="middle" fill="#232F3E" font-size="12">EC2 — Web servers</text>
      <rect x="967" y="490" width="40" height="40" rx="4" fill="#FF9900"/>
      <rect x="956" y="494" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="956" y="503" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="956" y="512" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="1077" y="490" width="40" height="40" rx="4" fill="#FF9900"/>
      <rect x="1066" y="494" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="1066" y="503" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="1066" y="512" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <text x="1042" y="546" text-anchor="middle" fill="#232F3E" font-size="12">EC2 — Web servers</text>
    </g>
    <!-- EC2 app tier -->
    <g>
      <rect x="542" y="568" width="40" height="40" rx="4" fill="#FF9900"/>
      <rect x="531" y="572" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="531" y="581" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="531" y="590" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="652" y="568" width="40" height="40" rx="4" fill="#FF9900"/>
      <rect x="641" y="572" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="641" y="581" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="641" y="590" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <text x="617" y="630" text-anchor="middle" fill="#232F3E" font-size="12">EC2 — App servers</text>
      <rect x="967" y="568" width="40" height="40" rx="4" fill="#FF9900"/>
      <rect x="956" y="572" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="956" y="581" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="956" y="590" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="1077" y="568" width="40" height="40" rx="4" fill="#FF9900"/>
      <rect x="1066" y="572" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="1066" y="581" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="1066" y="590" width="22" height="4" rx="2" fill="#FFFFFF"/>
      <text x="1042" y="630" text-anchor="middle" fill="#232F3E" font-size="12">EC2 — App servers</text>
    </g>
    <!-- RDS -->
    <g transform="translate(617,684)">
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#3B48CC"/>
      <ellipse cx="0" cy="-9" rx="13" ry="5" fill="#FFFFFF"/>
      <path d="M-13,-9 V9 A13,5 0 0 0 13,9 V-9" fill="#FFFFFF"/>
      <ellipse cx="0" cy="9" rx="13" ry="5" fill="#DCE3FF"/>
    </g>
    <text x="617" y="730" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">Amazon RDS</text>
    <text x="617" y="746" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">Database (primary)</text>
    <g transform="translate(1042,684)">
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#3B48CC"/>
      <ellipse cx="0" cy="-9" rx="13" ry="5" fill="#FFFFFF"/>
      <path d="M-13,-9 V9 A13,5 0 0 0 13,9 V-9" fill="#FFFFFF"/>
      <ellipse cx="0" cy="9" rx="13" ry="5" fill="#DCE3FF"/>
    </g>
    <text x="1042" y="730" text-anchor="middle" fill="#232F3E" font-size="13" font-weight="700">Amazon RDS</text>
    <text x="1042" y="746" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">Database (standby)</text>

    <!-- Load balancers (straddle the AZ boundary) -->
    <g transform="translate(830,510)">
      <rect x="-32" y="-24" width="64" height="48" rx="8" fill="#8C4FFF"/>
      <circle cx="0" cy="-10" r="4" fill="#FFFFFF"/>
      <circle cx="-15" cy="4" r="5" fill="#FFFFFF"/>
      <circle cx="15" cy="4" r="5" fill="#FFFFFF"/>
      <line x1="0" y1="-10" x2="-15" y2="4" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="-10" x2="15" y2="4" stroke="#FFFFFF" stroke-width="2"/>
      <text x="0" y="19" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">ELB</text>
    </g>
    <g transform="translate(830,588)">
      <rect x="-32" y="-24" width="64" height="48" rx="8" fill="#8C4FFF"/>
      <circle cx="0" cy="-10" r="4" fill="#FFFFFF"/>
      <circle cx="-15" cy="4" r="5" fill="#FFFFFF"/>
      <circle cx="15" cy="4" r="5" fill="#FFFFFF"/>
      <line x1="0" y1="-10" x2="-15" y2="4" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="-10" x2="15" y2="4" stroke="#FFFFFF" stroke-width="2"/>
      <text x="0" y="19" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">ELB</text>
    </g>

    <!-- In-VPC traffic arrows -->
    <line x1="798" y1="510" x2="696" y2="510" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="862" y1="510" x2="963" y2="510" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="830" y1="536" x2="830" y2="562" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="798" y1="588" x2="696" y2="588" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="862" y1="588" x2="963" y2="588" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="617" y1="610" x2="617" y2="656" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="1042" y1="610" x2="1042" y2="656" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="641" y1="684" x2="1014" y2="684" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="830" y="702" text-anchor="middle" fill="#232F3E" font-size="12">Multi-AZ replication</text>
    <!-- Web -> S3 / App -> EFS / App -> ElastiCache -->
    <polyline points="542,510 410,510 410,388 374,388" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="476" y="528" text-anchor="middle" fill="#232F3E" font-size="11">static assets</text>
    <polyline points="542,588 430,588 430,468 374,468" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="486" y="606" text-anchor="middle" fill="#232F3E" font-size="11">shared files</text>
    <polyline points="560,608 560,655 376,655" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Hybrid links: Direct Connect + IPsec VPN -->
  <g>
    <!-- Direct Connect -->
    <line x1="270" y1="640" x2="400" y2="640" stroke="#1D8102" stroke-width="2" marker-end="url(#arrG)"/>
    <text x="320" y="662" text-anchor="middle" fill="#1D8102" font-size="12" font-weight="700">Direct Connect</text>
    <g transform="translate(414,640)">
      <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#3F9C35"/>
      <path d="M-12,-6 H8 M8,-6 l-5,-4 M8,-6 l-5,4 M12,8 H-8 M-8,8 l5,-4 M-8,8 l5,4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
    <text x="414" y="676" text-anchor="middle" fill="#232F3E" font-size="11" font-weight="700">DXGW</text>
    <!-- IPsec VPN -->
    <line x1="270" y1="700" x2="400" y2="700" stroke="#ED8B00" stroke-width="2" marker-end="url(#arrO)"/>
    <text x="320" y="716" text-anchor="middle" fill="#ED8B00" font-size="12" font-weight="700">IPsec VPN · 2 tunnels</text>
    <g transform="translate(414,700)">
      <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#FF9900"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <text x="414" y="736" text-anchor="middle" fill="#232F3E" font-size="11" font-weight="700">VGW</text>
  </g>

  <!-- Legend -->
  <text x="640" y="838" text-anchor="middle" fill="#555555" font-size="12">VGW = Virtual Private Gateway · DXGW = Direct Connect Gateway · AZ = Availability Zone · Every tier runs in two AZs</text>
</svg>
